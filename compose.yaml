
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fulfillops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fulfillops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api-1:
    image: fulfillops:local
    build: .
    environment: &api-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql://fulfillops:change-me@db:5432/fulfillops}
      POOL_SIZE: ${POOL_SIZE:-20}
      PORT: 8080
      APP_ENV: ${APP_ENV:-development}
      FAIL_READINESS: ${FAIL_READINESS:-false}
      MIGRATIONS_DIR: db/migrations
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  api-2:
    image: fulfillops:local
    environment: *api-environment
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker-1:
    image: fulfillops:local
    command: ["python", "-m", "fulfillops.worker"]
    environment: &worker-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql://fulfillops:change-me@db:5432/fulfillops}
      APP_ENV: ${APP_ENV:-development}
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-3}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-0.5}
      LEASE_SECONDS: ${LEASE_SECONDS:-10}
      BACKOFF_BASE_S: ${BACKOFF_BASE_S:-2}
      BACKOFF_CAP_S: ${BACKOFF_CAP_S:-30}
      PROCESSING_SECONDS: ${PROCESSING_SECONDS:-0.5}
      POISON_CUSTOMER_ID: ${POISON_CUSTOMER_ID:-}
      WORKER_ID: worker-1
    depends_on:
      api-1:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s

  worker-2:
    image: fulfillops:local
    command: ["python", "-m", "fulfillops.worker"]
    environment:
      <<: *worker-environment
      WORKER_ID: worker-2
    depends_on:
      api-1:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
