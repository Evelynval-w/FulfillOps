
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: fulfillops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fulfillops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard
