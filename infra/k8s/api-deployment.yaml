
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-api
  namespace: fulfillops
  labels:
    app: fulfillops-api
    app.kubernetes.io/part-of: fulfillops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fulfillops-api
  template:
    metadata:
      labels:
        app: fulfillops-api
      annotations:
        fulfillops.openai.com/rollout-evidence: "20261113"
    spec:
      containers:
        - name: api
          image: fulfillops:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fulfillops-secret
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: fulfillops-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
            capabilities:
               drop:
                 - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
