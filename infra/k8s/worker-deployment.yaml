
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-worker
  namespace: fulfillops
  labels:
    app: fulfillops-worker
    app.kubernetes.io/part-of: fulfillops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fulfillops-worker
  template:
    metadata:
      labels:
        app: fulfillops-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: fulfillops:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "fulfillops.worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fulfillops-secret
                  key: DATABASE_URL
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: fulfillops-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
